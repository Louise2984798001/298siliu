<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>作文 / 翻译图片批改 · CET Score Lab</title><style>
:root{--ink:#172a42;--muted:#69798d;--line:#e0e8f0;--blue:#315fda;--bg:#f4f7fb;--green:#13856a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:850px;margin:32px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750}a{color:var(--blue);text-decoration:none}.back{background:#e8efff;padding:7px 12px;border-radius:99px;font-size:13px}h1{font-size:30px;margin:25px 0 4px}.intro{color:var(--muted);margin:0 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 25px #18345b08;margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field select,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}.field textarea{min-height:100px;resize:vertical}.drop{border:1.5px dashed #aabbd3;border-radius:14px;background:#f8faff;padding:23px;text-align:center;cursor:pointer}.drop input{display:none}.preview{max-width:100%;max-height:420px;border-radius:10px;margin-top:14px;display:none}.small{font-size:12px;color:var(--muted)}button{border:0;border-radius:10px;padding:12px 18px;font:600 14px inherit;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:disabled{opacity:.55;cursor:wait}.output{white-space:pre-wrap;line-height:1.8}.status{display:none;padding:11px 13px;background:#fff5e9;color:#98531a;border-radius:10px;margin:14px 0}.result{display:none}.privacy{padding:12px;background:#f7f9fc;color:var(--muted);font-size:12px;border-radius:10px;margin-top:16px}@media(max-width:650px){.wrap{margin:18px auto}.row{grid-template-columns:1fr}h1{font-size:26px}.card{padding:17px}}
</style></head><body><main class="wrap"><div class="top"><b class="brand">CET SCORE LAB</b><a class="back" href="./index.html">← 返回分数估算器</a></div><h1>作文 / 翻译图片批改</h1><p class="intro">上传答题照片，让 AI 尝试识别内容并按四六级写作或翻译要求给出估分与建议。</p><section class="card"><div class="row"><div class="field"><label for="level">考试级别</label><select id="level"><option value="CET-4">英语四级 CET-4</option><option value="CET-6">英语六级 CET-6</option></select></div><div class="field"><label for="kind">批改类型</label><select id="kind"><option value="作文">作文（15 分）</option><option value="翻译">翻译（15 分）</option></select></div></div><div class="field" style="margin-top:16px"><label>答题照片</label><label class="drop" for="image">点击选择或拍摄答题照片<br><span class="small">支持 JPG、PNG、WebP；建议文字清晰、完整，单张最大 8 MB</span><input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview" alt="答题照片预览"></div><div class="field" id="promptWrap" style="margin-top:16px;display:none"><label for="prompt">作文题目 / 写作要求（可选）</label><textarea id="prompt" placeholder="粘贴题目或写作要求，帮助评分更准确"></textarea></div><div class="actions" style="margin-top:18px"><button id="submit" class="primary">识别并批改</button></div><div id="status" class="status"></div><div class="privacy">照片会被发送到本工具配置的 Cloudflare Worker，再转发给 DeepSeek 进行识别和评分。请勿上传含有姓名、准考证号等个人信息的图片；评分仅作练习参考。</div></section><section id="result" class="card result"><h2 style="margin-top:0">批改结果</h2><div id="output" class="output"></div></section><p class="small">图片能力使用 DeepSeek 视觉模型。AI 识别手写内容可能出错；请对照原文核对识别结果和分数。</p></main><script>
const WORKER_URL='https://cool-voice-8dbf.2984798001.workers.dev/'; // 部署 Worker 后，填写完整地址，例如 https://cet-grader.your-name.workers.dev
const fileInput=document.getElementById('image'),preview=document.getElementById('preview'),status=document.getElementById('status'),submit=document.getElementById('submit');let selectedFile=null;document.getElementById('kind').addEventListener('change',e=>document.getElementById('promptWrap').style.display=e.target.value==='作文'?'block':'none');fileInput.addEventListener('change',()=>{selectedFile=fileInput.files[0]||null;if(!selectedFile){preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(selectedFile.type)){show('请选择 JPG、PNG 或 WebP 图片。');selectedFile=null;return}if(selectedFile.size>8*1024*1024){show('图片超过 8 MB，请压缩后重试。');selectedFile=null;return}preview.src=URL.createObjectURL(selectedFile);preview.style.display='block';status.style.display='none'});function show(t){status.textContent=t;status.style.display='block'}submit.addEventListener('click',async()=>{if(!selectedFile){show('请先选择答题照片。');return}if(!WORKER_URL){show('还未配置评分服务地址。请按部署说明发布 Cloudflare Worker，并将其地址填入 essay-check.html 中的 WORKER_URL。');return}submit.disabled=true;submit.textContent='正在识别和批改…';status.style.display='none';try{const form=new FormData();form.append('image',selectedFile);form.append('level',document.getElementById('level').value);form.append('kind',document.getElementById('kind').value);form.append('prompt',document.getElementById('prompt').value);const response=await fetch(WORKER_URL,{method:'POST',body:form});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败，请稍后重试');document.getElementById('output').textContent=data.result||'没有收到有效评分结果。';document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'})}catch(e){const m=e instanceof TypeError?'浏览器无法读取评分服务响应。请确认 Cloudflare Worker 已部署最新代码，且已允许 https://louise2984798001.github.io 跨域访问；也可检查手机网络或换浏览器重试。':(e.message||'评分服务请求失败，请稍后重试。');show(m)}finally{submit.disabled=false;submit.textContent='识别并批改'}});
</script></body></html>
